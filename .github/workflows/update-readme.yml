name: Update README with Public Repositories

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch public repositories
        id: repos
        uses: actions/github-script@v7
        with:
          script: |
            const repos = await github.rest.repos.listForUser({
              username: context.repo.owner,
              type: 'public',
              sort: 'updated',
              per_page: 100
            });

            let repoList = '## 📚 Public Repositories\n\n';

            for (const repo of repos.data) {
              if (!repo.fork && !repo.archived) {
                const description = repo.description || 'No description';
                const stars = repo.stargazers_count > 0 ?
                  `⭐ ${repo.stargazers_count}` : '';
                const language = repo.language || '';

                repoList += `### [${repo.name}](${repo.html_url})\n`;
                repoList += `${description}\n`;
                if (language || stars) {
                  repoList +=
                    `${language}${language && stars ? ' | ' : ''}${stars}\n`;
                }
                repoList += '\n';
              }
            }

            return repoList;
          result-encoding: string

      - name: Update README
        env:
          REPO_LIST: ${{ steps.repos.outputs.result }}
        run: |
          cat > README.md << 'EOF'
          # .github

          Welcome to Netonia's GitHub profile! 👋

          ${{ steps.repos.outputs.result }}

          ---
          *This README is automatically updated daily*
          EOF

      - name: Commit changes
        run: |
          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Update README with public repositories"
          git push
